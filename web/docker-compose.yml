services:
    nginx:
        image: nginx:1.15
        container_name: nginx
        volumes:
            - ./:/var/www
            - ./default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 80:80
        networks:
            - my-network
        depends_on:
            - flask
    flask:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: flask
        command: /bin/sh -c '/usr/sbin/sshd -D & gunicorn --bind 0.0.0.0:8000 --workers 4 "app.create_app:create_app()"'
        volumes:
            - ./:/var/www
            - home:/home/erik
        ports:
            - 2226:22
        networks:
            - my-network
            
networks:
    my-network:

volumes:
    home:
        external: true
        name: home

